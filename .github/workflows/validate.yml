name: Validate app source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Test Iraqi phone normalization
        run: node scripts/test-phone.cjs
      - name: Verify Expo and EAS application identifiers
        run: node scripts/verify-eas-config.cjs
      - name: Type-check workspaces
        run: npm run typecheck
